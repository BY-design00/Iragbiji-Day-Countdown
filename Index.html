<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iragbiji Day Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navigation">
        <img id="logo" src="Day_Logo 1.png" alt="Iragbiji_Day_Logo">
        <img id="logo2" src="Day_Logo 2.png" alt="Iragbiji_Day_Logo">
    </nav>
    <section class="Image_Container">
        <img src="35th_Day.png" alt="Day_Logo" class="Main_Logo">
    </section>
    <h1 id="heading">
        COUNTDOWN TO THE DAY
    </h1>
    <div id="container">
        <div>
            <span id="days"> 00</span>
            <small>DAYS</small>
        </div>

        <div>
            <span id="hours">00</span>
            <small>HOURS</small>
        </div>
        <div>
            <span id="minutes"> 00</span>
            <small>MINUTES</small>
        </div>

        <div> 
            <span id="seconds"> 00</span>
            <small>SECONDS</small>
        </div>
    
    </div>
    <p id="message">
        You are invited to celebrate the joyous day with us.
    </p> 

    <script src="script.js"></script>
</body>
</html>
